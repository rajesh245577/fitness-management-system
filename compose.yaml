services:
  app:
    image: fitness-management-system:latest
    build: .
    container_name: fitness-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/fitnessdb
      SPRING_DATASOURCE_USERNAME: fitness
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-fitness_dev_only}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: fitness-db
    environment:
      MYSQL_DATABASE: fitnessdb
      MYSQL_USER: fitness
      MYSQL_PASSWORD: ${DB_PASSWORD:-fitness_dev_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_only}
    volumes:
      - fitness-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  fitness-data:
